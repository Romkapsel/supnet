# Jita-roboten (spec v3, blokk 1.1 steg 8). Alle tider er UTC.
# Merk: GitHub kan bruke opptil en time på å aktivere nye cron-planer, og hopper over kjøringer under høy last.
name: jita

on:
  schedule:
    - cron: "23 * * * *"        # timesjobb (09:23 UTC = etter downtime)
    - cron: "5,25,45 * * * *"   # watchlist, lett
    - cron: "29 * * * *"        # historikk, hver time (inntil 400 varer, roterer over forfilteret)
    - cron: "0 3 1 * *"         # seed av varetyper, månedlig (nye varer i spillet)
  workflow_dispatch:
    inputs:
      job:
        description: "Hvilken jobb (hourly / watchlist / history / seed)"
        default: "hourly"
  repository_dispatch:
    types: [jita-scan, jita-watchlist, jita-history]

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  JITA_PIN: ${{ secrets.JITA_PIN }}                 # for /api/token → strukturordrer
  SNAPSHOT_DIR: ${{ github.workspace }}/jita/snapshots
  PYTHONUNBUFFERED: "1"

jobs:
  hourly:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-scan') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'hourly') ||
      (github.event_name == 'schedule' && github.event.schedule == '23 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jita-hourly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - name: Hent forrige snapshot
        uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-snapshot-${{ github.run_id }}
          restore-keys: jita-snapshot-
      - name: Ordrebok → diff → type_hourly → judge
        run: python jita/scripts/ingest_orders.py
      - name: Lagre nytt snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-snapshot-${{ github.run_id }}

  watchlist:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-watchlist') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'watchlist') ||
      (github.event_name == 'schedule' && github.event.schedule == '5,25,45 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: jita-watchlist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-watchlist-${{ github.run_id }}
          restore-keys: jita-watchlist-
      - run: python jita/scripts/ingest_watchlist.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-watchlist-${{ github.run_id }}

  history:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-history') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'history') ||
      (github.event_name == 'schedule' && github.event.schedule == '29 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jita-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-history-${{ github.run_id }}
          restore-keys: jita-history-
      - run: python jita/scripts/ingest_history.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-history-${{ github.run_id }}

  seed:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'seed') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jita/scripts/requirements.txt
      - run: python jita/scripts/seed_types.py
