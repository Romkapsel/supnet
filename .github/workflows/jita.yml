# Jita-roboten (spec v3, blokk 1.1 steg 8). Alle tider er UTC.
# Merk: GitHub kan bruke opptil en time på å aktivere nye cron-planer, og hopper over kjøringer under høy last.
name: jita

on:
  schedule:
    - cron: "23 * * * *"        # timesjobb (09:23 UTC = etter downtime)
    - cron: "5,25,45 * * * *"   # watchlist, lett
    - cron: "29 * * * *"        # historikk, hver time (inntil 400 varer, roterer over forfilteret)
    - cron: "40 5 * * *"        # industri-marginfinner, daglig (etter rydding kl. 05:00)
    - cron: "0 3 1 * *"         # seed av varetyper, månedlig (nye varer i spillet)
  workflow_dispatch:
    inputs:
      job:
        description: "Hvilken jobb (hourly / watchlist / history / industry / seed / probe)"
        default: "hourly"
  repository_dispatch:
    types: [jita-scan, jita-watchlist, jita-history, jita-industry]

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  SNAPSHOT_DIR: ${{ github.workspace }}/jita/snapshots
  PYTHONUNBUFFERED: "1"

jobs:
  hourly:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-scan') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'hourly') ||
      (github.event_name == 'schedule' && github.event.schedule == '23 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jita-hourly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - name: Hent forrige snapshot
        uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-snapshot-${{ github.run_id }}
          restore-keys: jita-snapshot-
      - name: Ordrebok → diff → type_hourly → judge
        run: python jita/scripts/ingest_orders.py
      - name: Lagre nytt snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-snapshot-${{ github.run_id }}

  watchlist:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-watchlist') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'watchlist') ||
      (github.event_name == 'schedule' && github.event.schedule == '5,25,45 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: jita-watchlist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-watchlist-${{ github.run_id }}
          restore-keys: jita-watchlist-
      - run: python jita/scripts/ingest_watchlist.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-watchlist-${{ github.run_id }}

  history:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-history') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'history') ||
      (github.event_name == 'schedule' && github.event.schedule == '29 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jita-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-history-${{ github.run_id }}
          restore-keys: jita-history-
      - run: python jita/scripts/ingest_history.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-history-${{ github.run_id }}

  industry:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'jita-industry') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'industry') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 5 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: jita-industry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jita/scripts/requirements.txt
      - run: pip install -r jita/scripts/requirements.txt
      - name: Formlene stemmer? (ingen nett/database)
        run: |
          python jita/scripts/test_industry.py
          python jita/scripts/test_mining.py
      - uses: actions/cache/restore@v4
        with:
          path: jita/snapshots
          key: jita-industry-${{ github.run_id }}
          restore-keys: jita-industry-
      - name: Oppskrifter + priser -> rangering
        run: python jita/scripts/ingest_industry.py --csv jita-industri-topp30.csv
      - name: "Mining: refine-utbytte + priser -> ISK per time"
        run: python jita/scripts/ingest_mining.py --csv jita-mining.csv
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: jita/snapshots
          key: jita-industry-${{ github.run_id }}
      - name: Last opp topp 30 som CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jita-industri-topp30
          path: |
            jita-industri-topp30.csv
            jita-mining.csv
          if-no-files-found: ignore

  probe:
    # Sjekker hvilke eksterne datakilder som svarer og hvordan. Bare manuelt – rører ingen data.
    if: "github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'probe'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jita/scripts/requirements.txt
      - run: python jita/scripts/probe_sources.py

  seed:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'seed') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jita/scripts/requirements.txt
      - run: python jita/scripts/seed_types.py
