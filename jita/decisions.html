<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f1117"/>
  <title>Beslutninger – Jita</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="app"><p class="muted">Laster…</p></div>

<script type="module">
import { api, isk, price, pct, num, days, dt, el, esc, nav, injectCss } from './app.js';
injectCss();

async function load() {
  const d = await api('decisions');
  if (!d) return;
  const s = d.stats || {};
  const rows = d.decisions.map((x) => {
    const actualDays = x.filled_at ? (new Date(x.filled_at) - new Date(x.created_at)) / 864e5 : null;
    const state = x.closed_at ? 'Solgt' : x.filled_at ? 'Fylt – venter på salg' : 'Åpen kjøpsordre';
    return `<div class="card">
      <div class="row"><h3><a href="type.html?id=${x.type_id}">${esc(x.name)}</a></h3><span class="pill ${x.closed_at ? 'ok' : x.filled_at ? 'warn' : ''}">${state}</span></div>
      <div class="small muted">${dt(x.created_at)} · ${x.side === 'buy' ? 'kjøp' : 'salg'} ${x.qty} à ${price(x.price)}
        ${x.predicted_days != null ? `· spådd fylling ${days(x.predicted_days)}` : ''}${actualDays != null ? ` · faktisk <b>${days(actualDays)}</b>` : ''}
        ${x.predicted_net_per_unit != null ? `· spådd netto ${isk(x.predicted_net_per_unit)}/stk` : ''}</div>
      <div class="grid2" style="margin-top:8px">
        ${!x.filled_at ? `<div><label>Fylt (dato)</label><input type="datetime-local" id="fa${x.id}"/></div><div><label>Antall fylt</label><input type="number" id="fq${x.id}" value="${x.qty}"/></div>
          <div style="align-self:end"><button class="ghost" onclick="upd(${x.id}, {filled_at: v('fa${x.id}'), filled_qty: v('fq${x.id}')})">Marker fylt</button></div>` : ''}
        ${x.filled_at && !x.closed_at ? `<div><label>Solgt til pris</label><input type="number" step="any" id="sp${x.id}"/></div><div><label>Solgt (dato)</label><input type="datetime-local" id="sa${x.id}"/></div>
          <div style="align-self:end"><button class="ghost" onclick="upd(${x.id}, {sell_price: v('sp${x.id}'), closed_at: v('sa${x.id}') || new Date().toISOString()})">Marker solgt</button></div>` : ''}
        ${x.closed_at ? `<div class="small">Solgt ${dt(x.closed_at)} à ${price(x.sell_price)}</div>` : ''}
        <div style="align-self:end"><button class="ghost small" onclick="if(confirm('Slette?')) upd(${x.id}, {delete:true})">Slett</button></div>
      </div></div>`;
  }).join('') || '<div class="card muted">Ingen beslutninger ennå. Trykk «Jeg tok denne» på en vare i topp 10.</div>';

  el('app').innerHTML = `
    <h1>Beslutninger</h1>${nav('decisions.html')}
    <div class="card"><div class="stats">
      <div class="stat"><div class="l">Realisert 7 d</div><div class="v ${Number(s.profit_7d) >= 0 ? 'green' : 'red'}">${isk(s.profit_7d || 0)} ISK</div></div>
      <div class="stat"><div class="l">Realisert 30 d</div><div class="v ${Number(s.profit_30d) >= 0 ? 'green' : 'red'}">${isk(s.profit_30d || 0)} ISK</div></div>
      <div class="stat"><div class="l">Avsluttede</div><div class="v">${s.closed || 0}</div></div>
      <div class="stat"><div class="l">Faktisk / spådd fyllingstid</div><div class="v">${s.fill_ratio ? num(s.fill_ratio, 2) + '×' : '–'}</div></div>
    </div>
    <div class="muted small" style="margin-top:6px">${s.fill_ratio ? (Number(s.fill_ratio) > 1 ? `Vi spår innflyten ${pct(Number(s.fill_ratio) - 1, 0)} for høyt (det tar lenger tid enn spådd).` : `Vi spår innflyten ${pct(1 - Number(s.fill_ratio), 0)} for lavt (det går fortere enn spådd).`) : 'Marker beslutninger som fylt for å kalibrere spådommene.'}</div></div>
    ${rows}`;
}
window.v = (id) => { const e = el(id); return e ? e.value : ''; };
window.upd = async (id, body) => { try { await api('decision', { method: 'POST', body: { id, ...body } }); load(); } catch (e) { alert(e.message); } };
load();
</script>
</body>
</html>
