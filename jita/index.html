<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f1117"/>
  <title>Jita</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="icon" href="icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="app"><p class="muted">Laster…</p></div>

<script type="module">
import { api, isk, price, pct, num, days, ago, dt, el, esc, downtimeWarning, nav, injectCss, copyBtn } from './app.js';
injectCss();

// Faktorene bak scoren: grønn = løfter, grå = nøytral, rød = trekker ned
function factorPills(f) {
  const pill = (label, v, note) => { const x = Number(v); const cls = x > 1.02 ? 'ok' : x < 0.98 ? 'bad' : ''; return `<span class="pill ${cls}" title="${note || ''}">${label} ×${x.toFixed(2).replace('.', ',')}</span>`; };
  return `<span class="pill" title="antall × netto ÷ (1 + dager)">${isk(f.isk_per_day)}/dag</span>`
    + pill('historie', f.hist, f.hist_pos != null ? `hist_pos ${f.hist_pos} (1 = handles på ask, 0 = på bid)` : 'mangler historikk')
    + pill('etterspørsel', f.demand, 'liftet ÷ dumpet, tak 1')
    + pill('momentum', f.momentum, `volum siste 5 d ${isk(f.vol5)} mot 20 d ${isk(f.vol20)}`)
    + pill('stabil', f.stable, `dagsintervall (høy−lav)/snitt ${f.range5 != null ? (f.range5 * 100).toFixed(0) + ' %' : '–'}`)
    + pill('rulleblad', f.memory, 'dine egne handler med varen')
    + pill('krig', f.war, `${f.mods_per_hour} prisendringer/t nær toppen`);
}

// «Oppdater nå»: tilstanden ligger utenfor load(), fordi siden tegnes på nytt underveis (og hvert 5. min)
const refresh = { busy: false, msg: '' };

async function load() {
  let d;
  try { d = await api('summary'); } catch (e) { el('app').innerHTML = `<p class="err">Feil: ${esc(e.message)}</p>`; return; }
  if (!d) return;
  const p = d.profile;
  const hourly = d.robot.find((r) => r.job === 'hourly');
  const hourlyStale = !hourly || !hourly.ok || (Date.now() - new Date(hourly.run_at).getTime()) > 2 * 3600e3;

  const openBy = {};
  for (const o of d.open || []) (openBy[o.type_id] ||= []).push(o);
  const taken = (type_id) => (openBy[type_id] || []).map((o) =>
    `<span class="pill ${o.filled_at ? 'warn' : 'ok'}">✓ Din ordre ${o.qty} stk à ${price(o.price)}${o.filled_at ? ' · fylt' : ''}</span>`).join('');

  // Handling = gul/rød, «ikke gjør noe» = grå: fargen skal si hva du skal gjøre.
  const PILLE = { 'TREKK': 'bad', 'DUMP': 'bad', 'LA STÅ': '', 'HEV': 'warn', 'SENK': 'warn', 'RELIST': 'warn' };

  // Gebyrvakten: dagens broker-gebyr mot dagens salg. 27. sept 2026 var tallene 698k i gebyr på
  // 16 endringer mot 429k i salg. Dette er tallet som skal stoppe hånden din.
  const gebyrvakt = (f) => {
    if (!f || (!f.broker_today && !f.sales_today)) return '';
    const andel = f.share_today, over = andel != null && andel > f.cap;
    const uke = f.sales_7d > 0 ? f.broker_7d / f.sales_7d : null;
    return `<div class="card" style="border:1px solid ${over ? '#c04040' : '#2a2e40'}">
      <div class="row"><b>${over ? '🛑 Stopp: gebyrene løper i dag' : 'Gebyr i dag'}</b>
        <span class="${over ? 'red' : 'muted'}">${isk(f.broker_today)} ISK broker på ${f.changes_today} endringer${
          f.sales_today > 0 ? ` · ${pct(andel, 0)} av dagens salg (${isk(f.sales_today)})` : ' · ingen salg ennå i dag'}</span></div>
      ${over ? `<div class="small" style="margin-top:6px">Du har betalt <b>${isk(f.broker_today)}</b> i broker-gebyr mot
        <b>${isk(f.sales_today)}</b> i salg. Taket er ${pct(f.cap, 0)} av salget. Ikke endre flere ordrer i dag –
        la dem stå, eller selg til budet på det du vil ut av. Siste sju dager har ${uke != null ? pct(uke, 0) : '–'} av salget gått til broker.</div>`
        : `<div class="muted small" style="margin-top:4px">Siste sju dager: ${uke != null ? pct(uke, 0) : '–'} av salget til broker-gebyr. Taket for én dag er ${pct(f.cap, 0)}.</div>`}
    </div>`;
  };

  // Priskrig koster mer enn folk tror: hver omprising er et nytt broker-gebyr. 11.–27. sept gikk
  // ~6 mill. av 10,2 mill. i broker-gebyr til omprising. Varer med et rulleblad av undercuts
  // merkes derfor her, med gebyret det koster å jage prisen én gang.
  const krangel = (c) => {
    const u = Number(c.undercut_count || 0), o = Number(c.overbid_count || 0);
    if (c.mem_verdict !== 'krangel' && u < 10) return '';
    const gebyr = Number(d.profile?.broker || 0) * Number(c.qty || 0) * Number(c.sell_price || 0);
    return `<div class="row small" style="margin-top:4px"><span class="pill warn" title="Du har blitt underbudt ${u} ganger og overbudt ${o} ganger i denne varen">priskrig: ${u} undercuts</span>
      <span class="muted">Omprising koster <b>inntil ${isk(gebyr)}</b> i broker-gebyr (satsen på full ordreverdi; i praksis har snittet ditt vært ~25k per trekk). La ordren stå, eller dump til budet – ikke jag prisen.</span></div>`;
  };

  const top = d.top.length ? d.top.map((c, i) => `
    <div class="card link" onclick="location.href='type.html?id=${c.type_id}'">
      <div class="row"><h3>${i + 1}. ${esc(c.name)}${copyBtn(c.name)}</h3><span class="big accent">+${isk(c.expected_profit)} ISK</span></div>
      <div class="row small">
        <span>Kjøp <b>${c.qty} stk</b> à <b>${price(c.buy_price)}</b></span>
        <span>Selg på <b>${price(c.sell_price)}</b></span>
        <span class="muted">margin ${pct(c.margin)} · netto ${isk(c.net_per_unit)}/stk</span>
      </div>
      <div class="row small muted"><span>Fylling: kjøp ${days(c.days_to_fill_buy)} · salg ${days(c.days_to_fill_sell)}</span><span>score ${isk(c.score)}</span></div>
      ${krangel(c)}
      ${c.factors ? `<div style="margin-top:4px">${factorPills(c.factors)}</div>` : ''}
      ${c.timing ? `<div class="row small muted"><span>⏰ Dumpes mest kl. ${c.timing.buy_hours.join(', ')} · liftes mest kl. ${c.timing.sell_hours.join(', ')} (norsk tid, 7 d)</span></div>` : ''}
      <div class="reason">${esc(c.reason)}</div>
      ${openBy[c.type_id] ? `<div style="margin-top:6px">${taken(c.type_id)}</div>` : ''}
    </div>`).join('')
    : `<div class="card muted">Ingen nye varer passerer alle reglene akkurat nå${(d.open || []).length ? ' – de du holder ligger i beholdningen over' : ''}. Nye kandidater dukker opp av seg selv når reglene slår til.</div>`;

  const robot = d.robot.map((r) => `
    <div class="row small">
      <span><span class="pill ${r.ok ? 'ok' : 'bad'}">${esc(r.job)}</span> ${ago(r.run_at)}</span>
      <span class="muted">${r.pages_ok ?? '–'}/${r.pages_total ?? '–'} sider · ${r.duration_s ?? '–'} s · ratelimit ${r.ratelimit_remaining ?? '–'} · DB ${r.db_bytes ? (r.db_bytes / 1e6).toFixed(0) : '–'} MB</span>
    </div>${r.message ? `<div class="muted small">${esc(r.message)}</div>` : ''}`).join('') || '<span class="muted">Ingen kjøringer ennå.</span>';

  el('app').innerHTML = `
    <h1>Jita 4-4 <span class="muted" style="font-size:0.9rem">station trading</span></h1>
    ${nav('index.html')}
    ${downtimeWarning() ? '<div class="banner">⏳ Downtime – EVE er nede (11:00 UTC = 13:00 norsk), normalt ~15 min. Ikke legg ordrer nå.</div>' : ''}
    <div class="card">
      <div class="stats">
        <div class="stat"><div class="l">Kapital i arbeid</div><div class="v">${isk(p.capital_isk)} ISK</div><div class="muted" style="font-size:0.7rem">cash ${isk(p.cash_isk ?? p.capital_isk)} + escrow/lager ${isk(p.bound_isk)}</div></div>
        <div class="stat"><div class="l">Broker / skatt</div><div class="v">${pct(p.broker)} / ${pct(p.tax)}</div></div>
        <div class="stat"><div class="l">Break-even spread</div><div class="v">${pct(p.break_even)}</div></div>
        <div class="stat"><div class="l">Maks kjøpspris</div><div class="v">${isk(p.max_buy_price)}</div></div>
        <div class="stat"><div class="l">Data fra</div><div class="v">${ago(d.snapshot_at)}</div>${d.eve ? `<div class="muted" style="font-size:0.7rem">EVE-synk ${d.eve.last_sync ? ago(d.eve.last_sync) : 'aldri'}${d.eve.last_error ? ' ⚠' : ''}</div>` : `<div class="muted" style="font-size:0.7rem"><a href="settings.html">koble EVE-konto</a></div>`}</div>
        <div class="stat"><div class="l">Passerer / vurdert</div><div class="v">${d.counts?.passed ?? 0} / ${d.counts?.evaluated ?? 0}</div></div>
      </div>
      <div class="row" style="margin-top:10px"><input id="search" placeholder="Søk vare… (f.eks. Damage Control)" autocomplete="off"/></div>
      <div id="searchres"></div>
      <div class="row" style="margin-top:10px"><button id="scan" ${refresh.busy ? 'disabled' : ''} title="Henter dine ordrer og lommebok fra EVE nå, og starter markedsroboten (ordreboka i Jita) med én gang">Oppdater nå</button><span id="scanmsg" class="muted small">${esc(refresh.msg)}</span></div>
    </div>
    <h2>Topp 10 <span class="muted small">(rangert på ISK/dag for posisjonen × historie × etterspørsel × momentum × stabilitet × rulleblad × krig)</span></h2>${top}
    ${(() => { const pf = d.portfolio; if (!pf) return '';
        const over = pf.bound - pf.investable;
        return over > 0 ? `<div class="banner" style="background:#3a331f;color:var(--accent)">Ingen kjøpsforslag – du har ${isk(pf.bound)} ISK bundet mot ${isk(pf.investable)} investerbart (${pct(p.reserve_share, 0)} reserve). Frigjør ${isk(over)} ISK før nye kjøp.</div>`
             : !pf.picks.length ? `<div class="muted small" style="margin-bottom:8px">Ingen kjøpsforslag akkurat nå – ${isk(pf.left)} ISK ledig, men ingen kandidat tåler mer kapital (flyt/35 %-tak).</div>` : ''; })()}
    ${gebyrvakt(d.fees)}
    ${(d.todo || []).length ? `<h2>Å gjøre <span class="muted small">(${d.todo.length} · handlinger først, sortert på ISK)</span></h2>
    <div class="card" style="border:1px solid #f0c04055">${d.todo.map((x) => `
      <div class="row small" style="padding:7px 0;border-bottom:1px solid #2a2e40;align-items:flex-start${x.action === 'LA STÅ' ? ';opacity:0.85' : ''}">
        <span style="flex:1;min-width:220px"><span class="pill ${PILLE[x.action] ?? 'ok'}">${x.action}</span>
          <a href="type.html?id=${x.type_id}"><b>${esc(x.title)}</b></a>${copyBtn(x.name)}<div class="muted" style="margin-top:2px">${esc(x.detail)} · <i>${esc(x.where)}</i></div></span>
        <span class="${x.action === 'LA STÅ' ? 'muted' : 'accent'}" style="white-space:nowrap">${x.action === 'LA STÅ' ? `sparer ~${isk(x.impact)}` : `~${isk(x.impact)} ISK`}</span></div>`).join('')}
      <div class="muted small" style="margin-top:8px">Regnet nå fra dine ordrer i EVE mot siste ordrebok. Endring av ordrer krever at du er dokket i Jita 4-4.
        <b>«LA STÅ»</b> betyr at markedet har gått mot deg, men at det koster mer i gebyr å følge etter enn du henter inn –
        rør den ikke før tiden som står der. <b>«DUMP»</b> er utveien fra en priskrig: selg rett til kjøpsbudet, da betaler du bare skatt.</div></div>`
    : `<h2>Å gjøre</h2><div class="card muted">Ingenting krever handling akkurat nå.</div>`}
    ${(d.alerts || []).length ? `<h2>Varsler <span class="muted small">(siste 48 t)</span></h2><div class="card">${d.alerts.map((a) =>
      `<div class="row small" style="padding:4px 0;border-bottom:1px solid #2a2e40"><span>${a.kind === 'unlisted' ? '📦' : a.kind === 'expiry' ? '⏳' : '✅'} ${a.type_id ? `<a href="type.html?id=${a.type_id}">${esc(a.text)}</a>` : esc(a.text)}</span><span class="muted">${ago(a.created_at)}</span></div>`).join('')}</div>` : ''}
    ${(d.hangar || []).length ? `<h2>Hangar i Jita 4-4 <span class="muted small">(fra EVE)</span></h2><div class="card">${d.hangar.map((h) => {
      const tick = (p) => Math.pow(10, Math.floor(Math.log10(p)) - 3);
      const sell = h.best_ask ? Number(h.best_ask) - tick(Number(h.best_ask)) : null;
      const net = sell ? sell * (1 - Number(p.broker) - Number(p.tax)) : null;
      return `<div class="row small" style="padding:5px 0;border-bottom:1px solid #2a2e40">
        <span><a href="type.html?id=${h.type_id}">${esc(h.name)}</a>${copyBtn(h.name)} · <b>${h.qty} stk</b> ${h.listed ? '<span class="pill ok">salgsordre ute</span>' : '<span class="pill warn">ikke lagt ut</span>'}</span>
        <span class="muted">${sell ? `legg ut à <b class="accent">${price(sell)}</b> (netto ${isk(net)}/stk, ${isk(net * h.qty)} totalt)` : 'ingen pris nå'}</span></div>`; }).join('')}</div>` : ''}
    ${(d.open || []).length ? `<h2>Beholdning <span class="muted small">(${new Set(d.open.map((o) => o.type_id)).size} posisjoner · fra EVE, oppdateres automatisk)</span></h2>
    ${Object.values(d.open.reduce((acc, o) => {   // slå sammen ordrer på samme vare til én posisjon
        const g = acc[o.type_id] ||= { ...o, orders: [], qty: 0, cost: 0 };
        g.orders.push(o); g.qty += Number(o.filled_qty ?? o.qty); g.cost += Number(o.price) * Number(o.filled_qty ?? o.qty);
        g.filled_at = g.orders.every((x) => x.filled_at) ? o.filled_at : null;
        if (o.alert_kind === 'overbid' && (!g.alert || o.alert_at > g.alert_at)) { g.alert = o.alert; g.alert_at = o.alert_at; g.alert_kind = 'overbid'; }
        g.created_at = g.orders.map((x) => x.created_at).sort()[0];
        return acc; }, {})).map((o) => {
      o.price = o.cost / o.qty;
      const topup = (d.portfolio?.picks || []).find((x) => x.type_id === o.type_id && x.have);
      const overbid = o.best_bid != null && o.orders.some((x) => Number(o.best_bid) > Number(x.price) && !x.filled_at);
      const status = o.filled_at ? '<span class="pill warn">fylt – venter på salg</span>'
        : overbid ? '<span class="pill bad">overbudt – noen ligger over deg</span>' : '<span class="pill ok">kjøpsordre ute</span>';
      const a = overbid && o.alert_kind === 'overbid' ? o.alert : null;
      const advice = a ? `<div class="card" style="background:#2a2230;margin:8px 0 0;padding:10px 12px">
          <b class="${a.action === 'ENDRE' ? 'accent' : a.action === 'TREKK' ? 'red' : 'green'}">${a.action}</b>
          <span class="small"> – ${esc(a.text)}</span>
          <div class="muted small" style="margin-top:4px">Toppbud ${price(a.best_bid)} · mur ${a.wall_qty} stk (~${a.days_wall} d) · endring koster ${isk(a.fee)} ISK${a.action === 'ENDRE' ? ` → ny pris <b>${price(a.new_price)}</b>` : ''} · vurdert ${ago(o.alert_at)}</div></div>`
        : overbid ? '<div class="muted small" style="margin-top:6px">Overbudt siden siste snapshot – råd kommer ved neste robotkjøring (maks 20 min).</div>' : '';
      const dom = o.passed == null ? '<span class="pill">ikke dømt nå</span>'
        : o.passed ? '<span class="pill ok">passerer fortsatt</span>'
        : `<span class="pill bad">passerer ikke lenger</span> ${(o.failed_rules || []).map((r) => `<span class="pill bad">${esc(d.rules[r] || r)}</span>`).join('')}`;
      return `<div class="card link" onclick="location.href='type.html?id=${o.type_id}'">
        <div class="row"><h3>${esc(o.name)}${copyBtn(o.name)}</h3><span class="big accent">${o.qty} stk à ${price(o.price)}</span></div>
        <div class="row small"><span>${status} ${dom}</span><span class="muted">${o.orders.length > 1 ? o.orders.map((x) => `${x.qty} à ${price(x.price)}`).join(' + ') + ' · ' : ''}tatt ${dt(o.created_at)}</span></div>
        <div class="row small muted" style="margin-top:4px">
          <span>Nå: bud <b>${price(o.best_bid)}</b> (${o.bid_top_qty ?? '–'} stk, ${o.bid_orders_1pct ?? '–'} budgivere) · ask <b>${price(o.best_ask)}</b></span>
          <span>${o.net_now != null ? `netto nå ${isk(o.net_now)}/stk (${pct(o.margin_now)})` : ''}${o.bfs_per_day != null ? ` · ${num(o.s2b_per_day)}/dag inn, ${num(o.bfs_per_day)}/dag ut` : ''}</span></div>
        ${o.reason && o.reason.includes('Svakhet') ? `<div class="reason">${esc(o.reason.slice(o.reason.indexOf('Svakhet')))}</div>` : ''}
        ${advice}
        ${topup ? `<div class="row small" style="margin-top:8px"><span class="accent">Flyten tåler <b>+${topup.qty}</b> (${isk(topup.cost)}) → +${isk(topup.expected_profit)} – legg en ny kjøpsordre i spillet, den fanges opp ved neste synk</span></div>` : ''}
      </div>`; }).join('')}
    <div class="card small"><span class="muted">Bundet: <b>${isk(p.bound_isk)} ISK</b> · cash ${isk(p.cash_isk ?? 0)} (<a href="settings.html">oppdater</a>) · reserve ${pct(p.reserve_share, 0)} = ${isk(Number(p.capital_isk) * Number(p.reserve_share))} · <b>kan investeres nå: ${isk(d.portfolio?.left)}</b></span></div>` : ''}
    <h2>Robot</h2><div class="card ${hourlyStale ? 'red' : ''}">${hourlyStale ? '<div class="pill bad">Timesjobben er > 2 t gammel eller feilet</div>' : ''}${robot}
      <div class="row small" style="margin-top:8px;padding-top:8px;border-top:1px solid #2a2e40">
        <span>Database: <b class="${(d.db?.db_bytes || 0) > 350e6 ? 'red' : (d.db?.db_bytes || 0) > 250e6 ? 'accent' : ''}">${((d.db?.db_bytes || 0) / 1e6).toFixed(0)} MB</b> av 500 MB
          ${(d.db?.db_bytes || 0) > 350e6 ? '<span class="pill bad">over 350 MB – rydding må sjekkes</span>' : (d.db?.db_bytes || 0) > 250e6 ? '<span class="pill warn">nærmer seg grensen</span>' : ''}</span>
        <span class="muted">${(d.db?.cron || []).map((j) => `${esc(j.jobname.replace('jita-', ''))}: ${j.status ? `<span class="${j.status === 'succeeded' ? 'green' : 'red'}">${j.status === 'succeeded' ? 'ok' : 'FEIL'}</span> ${ago(j.start_time)}` : 'ikke kjørt'}`).join(' · ')}</span>
      </div>
      ${(d.db?.cron || []).some((j) => j.status && j.status !== 'succeeded') ? `<div class="muted small red" style="margin-top:4px">${(d.db.cron).filter((j) => j.status && j.status !== 'succeeded').map((j) => `${esc(j.jobname)}: ${esc(j.msg || '')}`).join(' · ')}</div>` : ''}
    </div>`;

  let timer;
  el('search').oninput = () => {
    clearTimeout(timer);
    const term = el('search').value.trim();
    if (term.length < 2) { el('searchres').innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const r = await api('search', { query: { q: term } });
      el('searchres').innerHTML = (r?.types || []).map((t) =>
        `<div class="row small" style="padding:5px 0;border-bottom:1px solid #2a2e40"><span><a href="type.html?id=${t.type_id}">${esc(t.name)}</a>${copyBtn(t.name)}</span><span class="muted">${esc((t.market_group_path || '').split(' > ').slice(-2).join(' > '))}</span></div>`).join('')
        || '<div class="muted small">Ingen treff</div>';
    }, 250);
  };
  el('scan').onclick = oppdaterNa;
}

// «Oppdater nå»: 1) start markedsroboten (GitHub Actions, 3–5 min), 2) hent dine ordrer og lommebok fra
// EVE mens den går, og tegn siden på nytt, 3) følg med til roboten har levert ny ordrebok, og tegn på nytt.
// ESI selv har cache: ordreboka i Jita 5 min, dine ordrer ~20 min – ferskere enn det finnes ikke.
async function oppdaterNa() {
  if (refresh.busy) return;
  const start = Date.now();
  const vis = (msg, busy = true) => {
    refresh.msg = msg; refresh.busy = busy;
    const m = document.getElementById('scanmsg'), b = document.getElementById('scan');
    if (m) m.textContent = msg;
    if (b) b.disabled = busy;
  };
  const klokka = () => new Date().toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  try {
    vis('Starter markedsroboten…');
    // forrige timesjobb: ny kjøring = en annen run_at enn denne (ikke sammenlign med telefonens klokke)
    let forrige = null;
    try { forrige = (await api('fresh'))?.hourly?.run_at ?? null; } catch { /* da venter vi på første svar */ }
    let scan;
    try { scan = await api('scan', { method: 'POST' }); } catch (e) { scan = { ok: false, message: e.message }; }

    vis('Henter ordrene og lommeboka di fra EVE…');
    let eve;
    try { eve = await api('character', { method: 'POST' }); } catch (e) { eve = { ok: false, message: e.message }; }
    const eveTekst = eve?.ok ? 'EVE-data hentet' : `EVE-synk feilet (${eve?.message || 'ukjent feil'})`;
    await load();

    if (!scan?.ok) {
      // typisk «vent N min»: roboten gikk for under 10 min siden, og ESI har uansett 5 min cache
      vis(`${eveTekst} kl. ${klokka()}. Markedet ble ikke hentet på nytt: ${scan?.message || 'ukjent feil'}.`, false);
      return;
    }
    // følg med til en ny timesjobb er ferdig (ok eller feil), maks 12 min
    while (Date.now() - start < 12 * 60e3) {
      const s = Math.round((Date.now() - start) / 1000);
      vis(`${eveTekst}. Markedsroboten kjører… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} (vanligvis 3–5 min)`);
      await new Promise((r) => setTimeout(r, 15000));
      let f;
      try { f = await api('fresh'); } catch { continue; }
      const h = f?.hourly;
      if (h && h.run_at !== forrige) {
        if (!h.ok) { vis(`Markedsroboten feilet: ${h.message || 'ukjent feil'}. ${eveTekst}.`, false); await load(); return; }
        vis(`Alt oppdatert kl. ${klokka()}: ordreboka i Jita og dine ordrer er ferske.`, false);
        await load();
        return;
      }
    }
    vis(`${eveTekst}. Markedsroboten har ikke svart på 12 min – GitHub kan ha kø. Siden oppdateres av seg selv når den kommer.`, false);
  } catch (e) {
    vis(`Feil: ${e.message}`, false);
  }
}


load();
// auto-oppdatering hvert 5. minutt når fanen er synlig
setInterval(() => { if (document.visibilityState === 'visible' && !el('search')?.value) load(); }, 5 * 60000);
</script>
